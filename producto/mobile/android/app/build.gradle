apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def resolvedStoreFile = keystoreProperties.getProperty('storeFile')?.trim() ?: 'release.keystore'
def resolvedStorePassword = (System.getenv('KEYSTORE_PASSWORD') ?: keystoreProperties.getProperty('storePassword') ?: '').trim()
def resolvedKeyAlias = (System.getenv('KEY_ALIAS') ?: keystoreProperties.getProperty('keyAlias') ?: 'pcremote').trim()
def resolvedKeyPassword = (System.getenv('KEY_PASSWORD') ?: keystoreProperties.getProperty('keyPassword') ?: '').trim()
def hasReleaseSigning = file(resolvedStoreFile).exists() && !resolvedStorePassword.isEmpty() && !resolvedKeyPassword.isEmpty()

android {
    namespace = "com.pcremote.product"
    compileSdk = 36

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.pcremote.product"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 6
        versionName "1.5.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        buildConfigField "String", "BUILD_TIMESTAMP", "String.valueOf(System.currentTimeMillis())"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(resolvedStoreFile)
                storePassword resolvedStorePassword
                keyAlias resolvedKeyAlias
                keyPassword resolvedKeyPassword
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.3.0"
    implementation "androidx.core:core-splashscreen:1.2.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.7.0"
    implementation project(':capacitor-cordova-android-plugins')
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
}

apply from: 'capacitor.build.gradle'
