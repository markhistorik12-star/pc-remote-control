apply plugin: 'com.android.application'

android {
    namespace = "com.pcremote.product"
    compileSdk = 36

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.pcremote.product"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 4
        versionName "1.3.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        buildConfigField "String", "BUILD_TIMESTAMP", "String.valueOf(System.currentTimeMillis())"
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            // Las claves se leen de variables de entorno (no se suben al repo)
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: ''
            keyAlias 'pcremote'
            keyPassword System.getenv('KEY_PASSWORD') ?: ''
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.3.0"
    implementation "androidx.core:core-splashscreen:1.2.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.7.0"
    implementation project(':capacitor-cordova-android-plugins')
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
}

apply from: 'capacitor.build.gradle'
