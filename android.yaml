name: Android Release Build

# SOLUCIÓN AL ERROR: "No event triggers defined in `on`"
# El error ocurre cuando la sección `on:` está vacía o malformada
# Se deben definir triggers válidos como `push`, `pull_request`, `workflow_dispatch`, etc.

on:
  push:
    # Ejecutar en push de tags con formato v* (ej: v1.0.0)
    tags:
      - 'v*'
  # Permitir ejecución manual desde GitHub UI
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Mostrar triggers configurados
        run: |
          echo "✅ Triggers configurados:"
          echo "- push.tags: v* (semitags)"
          echo "- workflow_dispatch: manual"
          echo "❌ Error fix: Se definieron triggers válidos en la sección `on:`"

# Antes (error):
# on:  # <-- Esta sección vacía causa el error
#   # sin triggers definidos
#
# Después (correcto):
# on:
#   push:
#     tags:
#       - 'v*'
#   workflow_dispatch: